[package]
name = "nnlab"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
dirs = "7.0.0"
eframe = "0.37.0"
egui_plot = "0.38.0"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
